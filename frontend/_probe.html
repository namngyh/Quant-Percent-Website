<!doctype html>
<meta charset="utf-8">
<title>coverage warning probe</title>
<!--
  Drives the real app in an iframe to check the data-coverage warnings, which
  jsdom cannot reach: they are toasts raised from a live API call after a chart
  load. Lives under frontend/ because it has to be same-origin with the app to
  reach into the frame at all.

  Run (server must be up):
    chrome --headless --disable-gpu --virtual-time-budget=90000 \
           --dump-dom http://127.0.0.1:8000/static/_probe.html

  Read the <pre id="out"> block out of the dumped DOM. Note the toasts are
  watched with a MutationObserver rather than read at the end: they delete
  themselves after 5s, and reading once at the end reports a working warning
  as a broken one.
-->

<pre id="out">running…</pre>
<iframe id="app" src="/#trade" style="width:1200px;height:800px"></iframe>
<script>
const out = [];
const log = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function pick(doc, symbol, timeframe) {
  const sel = doc.getElementById('symbol');
  sel.value = symbol;
  sel.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
  await sleep(5000);                       // the VN database is slow; wait for it

  const buttons = [...doc.querySelectorAll('#timeframes .tf-btn')];
  log(`  khung co san: [${buttons.map((b) => b.textContent.trim()).join(', ')}]`);
  const tf = buttons.find((b) => b.textContent.trim() === timeframe);
  if (!tf) { log(`  KHONG co nut khung ${timeframe}`); return false; }
  tf.click();
  return true;
}

/* Toasts remove themselves after 5s, so reading once at the end sees nothing
   and reports a working warning as broken. Watch instead. */
function watchToasts(doc) {
  const seen = [];
  const obs = new doc.defaultView.MutationObserver((records) => {
    for (const rec of records) {
      for (const node of rec.addedNodes) {
        if (node.classList && node.classList.contains('toast')) {
          seen.push(node.textContent);
        }
      }
    }
  });
  obs.observe(doc.body, { childList: true });
  return seen;
}

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const doc = frame.contentDocument;
  await sleep(6000);                       // splash + first chart

  const opts = [...doc.querySelectorAll('#symbol option')].map((o) => o.value);
  log(`picker options: ${opts.length}`);
  log(`has VN:A32      : ${opts.includes('VN:A32')}`);
  log(`has VN:VN30F1M  : ${opts.includes('VN:VN30F1M')}`);
  log(`has VN:G-XAUUSD : ${opts.includes('VN:G-XAUUSD')}`);

  const seen = watchToasts(doc);

  // A thin symbol on an intraday frame must say so.
  log('\n[A32 @ 1m]');
  await pick(doc, 'VN:A32', '1m');
  await sleep(9000);
  log(`  toasts: ${seen.length}`);
  seen.forEach((t) => log(`  > ${t.slice(0, 140)}`));

  // A steady symbol with a real outage must name the session.
  seen.length = 0;
  log('\n[VN30F1M @ 1m]');
  await pick(doc, 'VN:VN30F1M', '1m');
  await sleep(9000);
  log(`  toasts: ${seen.length}`);
  seen.forEach((t) => log(`  > ${t.slice(0, 140)}`));

  // A daily frame must NOT warn: daily bars come from a different table.
  seen.length = 0;
  log('\n[A32 @ 1d]');
  await pick(doc, 'VN:A32', '1d');
  await sleep(7000);
  log(`  toasts: ${seen.length} (mong doi 0)`);

  log('\nDONE');
})().catch((e) => log('PROBE ERROR: ' + e.message));
</script>
