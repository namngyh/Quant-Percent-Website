<!doctype html>
<meta charset="utf-8">
<title>browser probes</title>
<!--
  Checks that only a real browser can make: they need a live chart, a live API
  and real layout, which jsdom does not provide and the Python tests cannot
  reach. Groups, run in order:

    coverage   the data-completeness toasts fire on the right symbols
    multichart the comparison panes draw candles, not just a chart frame
    switching  candle pixels after quick and slow symbol/timeframe switches
    autoscale  whether a drag freezes the price scale across instruments
    markets    a multi-market run lands on screen, in the Results panel
    picker     the searchable symbol list finds and loads markets
    boot       the opening screen leaves only after the data has arrived
    persist    a reload keeps symbol, frame, panel, indicators, strategy, layout
    resize     the 2/4-chart dividers change the sizes they claim to
    charttype  the chart-type menu is actually reachable by the pointer
    timing     where a page load spends its time

  Timings under --virtual-time-budget are virtual: the order of events is
  real, the millisecond counts are not.

  Run (the server must be up):
    chrome --headless --disable-gpu --window-size=1400,900 \
           --virtual-time-budget=90000 \
           --dump-dom http://127.0.0.1:8000/static/_probe.html

  Then read the <pre id="out"> block out of the dumped DOM.

  Three traps this file exists to remember:

  * Toasts delete themselves after 5s. Reading them once at the end finds none
    and reports a working warning as broken, so they are watched with a
    MutationObserver from the start.
  * A fresh iframe begins on about:blank, which already reports readyState
    "complete", and its load event may fire before this script runs. Neither
    is a reliable signal, so the frame is polled for a known element instead.
  * Every module here is a top-level `const`, which makes no window property.
    Reaching in for `w.MultiChart` gets `undefined` and the probe dies on the
    first line that uses it, so these groups drive the real controls.
-->
<pre id="out">running…</pre>
<iframe id="app" src="/#trade" style="width:1400px;height:900px"></iframe>
<script>
const out = [];
const log = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* Groups can be run one at a time: `?only=editor`. The full sweep drives five
   features through a live VN database and outgrows any single virtual-time
   budget, which looks exactly like a hung probe. */
const ONLY = new URLSearchParams(location.search).get('only');
const wants = (group) => !ONLY || ONLY === group;

/* Boot timing, watched from the first moment the frame exists.

   The groups below only start after the app is up and six seconds have
   passed, which is too late to see when the opening screen left relative to
   the data it is meant to wait for. This runs from script start instead. */
const bootT0 = performance.now();
const bootMarks = {};
(function watchBoot() {
  const frame = document.getElementById('app');
  const tick = () => {
    try {
      const d = frame.contentDocument;
      const fw = frame.contentWindow;
      if (d && d.getElementById('symbol')) {
        const now = Math.round(performance.now() - bootT0);
        const splash = d.getElementById('splash');
        if (!bootMarks.splashGone && (!splash || splash.classList.contains('done'))) bootMarks.splashGone = now;
        if (!bootMarks.vnList && d.getElementById('symbol').options.length > 1000) bootMarks.vnList = now;
        if (!bootMarks.chart) {
          try { if (fw.eval('ChartManager').seriesKey) bootMarks.chart = now; } catch (e) { /* not yet */ }
        }
      }
    } catch (e) { /* frame still on about:blank */ }
    const done = bootMarks.splashGone && bootMarks.vnList && bootMarks.chart;
    if (!done && performance.now() - bootT0 < 90000) setTimeout(tick, 50);
  };
  tick();
})();

/** Wait for the app frame to hold a real document (see the note above). */
async function appDocument(frame) {
  for (let i = 0; i < 160; i++) {
    const d = frame.contentDocument;
    if (d && d.getElementById('chart-type')) return d;
    await sleep(250);
  }
  return null;
}

/** Collect toasts as they appear; they remove themselves after 5s. */
function watchToasts(doc) {
  const seen = [];
  const obs = new doc.defaultView.MutationObserver((records) => {
    for (const rec of records) {
      for (const node of rec.addedNodes) {
        if (node.classList?.contains('toast')) seen.push(node.textContent);
      }
    }
  });
  obs.observe(doc.body, { childList: true });
  return seen;
}

/* A mounted chart and a chart holding candles look identical from the DOM:
   both are a <div> of canvases. Counting pixels painted in the up/down candle
   colours is the only way to tell them apart from out here. */
function candlePixels(cell) {
  /* Every chart canvas, and the most candle pixels any one of them holds.

     The first version took "the largest canvas", which in a pane is the price
     plot — but #chart-main also carries the drawing overlay (.draw-layer), a
     transparent canvas of exactly the chart's size. It won the size contest
     and reported 0 candle pixels on a chart full of candles, eight times in a
     row. The overlay is excluded, and no single canvas is assumed to be the
     plot. */
  let best = -1;
  for (const c of cell.querySelectorAll('canvas')) {
    if (c.closest('.draw-layer') || c.classList.contains('draw-layer') || !c.width || !c.height) continue;
    let px;
    try { px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; } catch (e) { continue; }
    let hits = 0;
    for (let p = 0; p < px.length; p += 4) {
      if ((px[p] === 8 && px[p + 1] === 153 && px[p + 2] === 129)
          || (px[p] === 242 && px[p + 1] === 54 && px[p + 2] === 69)) hits++;
    }
    if (hits > best) best = hits;
  }
  return best;
}

/* Wait for the thing being measured, never for a clock.

   The first version of this slept 7s after picking three markets and reported
   whichever panes had finished. Each pane fetches over the VPN and they do not
   finish together, so the same code scored 3, then 2, then 1 pane across three
   runs — it was measuring the probe's patience, not the feature. */
async function until(label, test, tries = 200) {
  for (let i = 0; i < tries; i++) {
    let got = null;
    try { got = test(); } catch (e) { got = null; }
    if (got) return got;
    await sleep(250);
  }
  throw new Error('timed out waiting for ' + label);
}

async function pick(doc, symbol, timeframe) {
  const sel = doc.getElementById('symbol');
  sel.value = symbol;
  sel.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
  await sleep(5000);                        // the VN database is not fast
  const button = [...doc.querySelectorAll('#timeframes .tf-btn')]
    .find((b) => b.textContent.trim() === timeframe);
  if (button) button.click();
  return !!button;
}

(async () => {

  const doc = await appDocument(frame);

  const w = frame.contentWindow;
  await sleep(6000);

  if (wants('coverage')) {
  log('=== coverage ===');

  seen.forEach((t) => log(`  > ${t.slice(0, 120)}`));

  seen.length = 0;
  await pick(doc, 'VN:A32', '1d');          // daily comes from another table
  await sleep(7000);
  log(`[A32 @ 1d]     ${seen.length} toast   (mong doi 0)`);

  }

  if (wants('editor')) {
  log('');
  log('=== trinh soan code ===');
  doc.querySelector('.rail-btn[data-panel="indicators"]')?.click();
  await sleep(400);
  const writeBtn = doc.querySelector('[data-write="indicator"]');
  log(`  nut "Viet code": ${!!writeBtn}`);
  writeBtn.click();
  await sleep(2500);

  const dlg = doc.querySelector('.editor-dialog');
  const code = dlg?.querySelector('[data-ed="code"]');

  log(`  hop thoai mo   : ${!!dlg}`);
  log(`  co khung mau   : ${code && code.value.includes('INDICATOR')}`);
  log(`  so dong gutter : ${gutter?.children.length}`);
  log(`  file co san    : ${dlg.querySelector('[data-ed="file"]').options.length} muc`);

  // Code sai cu phap -> phai bao loi, khong duoc im lang
  code.value = ['INDICATOR = {', '  "name": broken'].join(String.fromCharCode(10));
  code.dispatchEvent(new w.Event('input', { bubbles: true }));
  await sleep(2500);
  log(`  code sai  -> "${status.textContent.slice(0, 70)}" [${status.className}]`);

  // Code dung -> phai nhan ra la chi bao
  code.value = [
    'INDICATOR = {',
    '    "name": "Probe MA",',
    '    "kind": "overlay",',
    '    "params": [{"name": "length", "type": "int", "default": 10}],',
    '    "outputs": [{"key": "value", "label": "MA"}],',
    '}',
    '',
    '',
    'def calculate(df, params):',
    '    return {"value": df["close"].rolling(int(params["length"])).mean()}',
    '',
  ].join(String.fromCharCode(10));
  code.dispatchEvent(new w.Event('input', { bubbles: true }));
  await sleep(2500);
  log(`  code dung -> "${status.textContent.slice(0, 70)}" [${status.className}]`);
  log(`  so dong gutter sau: ${gutter?.children.length}`);

  // Luu that
  // Not '_probe_ma.py': a leading underscore is refused on purpose (the
  // loaders skip such files), the save would fail, and the unsaved-changes
  // confirm() would then hang headless Chrome with no visible reason.
  dlg.querySelector('[data-ed="name"]').value = 'probe_ma.py';
  dlg.querySelector('[data-ed="save"]').click();
  await sleep(6000);
  log(`  duong dan sau khi luu: "${dlg.querySelector('[data-ed="path"]').textContent}"`);

  dlg.querySelector('[data-ed="close"]').click();
  await sleep(600);
  log(`  da dong: ${!doc.querySelector('.editor-dialog')}`);

  }

  if (wants('markets')) {
  log('');
  log('=== nhieu thi truong ===');
  doc.querySelector('.rail-btn[data-panel="strategy"]')?.click();
  await sleep(600);
  const mmAdd = doc.getElementById('mm-add');
  const mmRun = doc.getElementById('run-markets');
  const mmNote = doc.getElementById('mm-timeframe-note');
  log(`  o chon co ${mmAdd ? mmAdd.options.length : 0} option`);
  log(`  ghi chu khung: ${JSON.stringify(mmNote?.textContent || '')}`);
  log(`  nut truoc khi chon: disabled=${mmRun?.disabled}`);

  for (const sym of ['BTCUSDT', 'VN:VNINDEX', 'VN:VIC', 'VN:SHS']) {
    mmAdd.value = sym;
    mmAdd.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(150);
  }
  log(`  da chon ${doc.querySelectorAll('#mm-chosen .mm-chip').length} chip`);
  log(`  nut sau khi chon: disabled=${mmRun?.disabled} "${mmRun?.textContent.trim()}"`);

  mmRun.click();
  for (let i = 0; i < 90 && doc.getElementById('markets-output')
       .querySelector('.empty'); i++) await sleep(1000);
  await sleep(1500);

  const out = doc.getElementById('markets-output');
  log(`  so dong bang : ${out.querySelectorAll('tbody tr').length}`);
  log(`  the tom tat  : ${out.querySelectorAll('.metric').length}`);
  log(`  canh bao     : ${out.querySelectorAll('.callout').length}`);
  const cards = [...out.querySelectorAll('.metric')].map(
    (m) => m.querySelector('.metric-label')?.textContent.trim() + '='
         + m.querySelector('.metric-value')?.textContent.trim());
  log(`  ${cards.join('  |  ')}`);
  for (const c of out.querySelectorAll('.callout')) {
    log(`  > ${c.textContent.trim().slice(0, 130).replace(/\s+/g, ' ')}`);
  }

  }

  if (wants('panels')) {
  log('');
  log('=== panel ben trai ===');
  for (const [name, sel] of [['Chi bao','indicators'], ['Chien luoc','strategy'],
                             ['Ket qua','results'], ['Danh muc','portfolio'],
                             ['Paper','paper']]) {
    const btn = doc.querySelector(`.rail-btn[data-panel="${sel}"]`);
    if (btn) btn.click();
    await sleep(400);
    const panel = doc.querySelector(`.panel[data-panel="${sel}"]`);
    const body = panel?.querySelector('.panel-body');
    if (!body) { log(`  ${name}: khong co`); continue; }
    const controls = panel.querySelectorAll(
      'input, select, button:not(.info-btn):not(.subtab)').length;
    const groups = panel.querySelectorAll('.field-group').length;
    const over = Math.max(0, body.scrollHeight - body.clientHeight);
    log(`  ${name.padEnd(11)} cao ${String(body.scrollHeight).padStart(5)}px`
        + ` / khung ${String(body.clientHeight).padStart(4)}px`
        + `  phai cuon ${String(over).padStart(5)}px`
        + `  ${String(controls).padStart(3)} dieu khien, ${groups} nhom`);
  }
  doc.querySelector('.rail-btn[data-panel="indicators"]')?.click();
  await sleep(300);

  }

  if (wants('smooth')) {
  log('');
  log('=== do muot cua du lieu ===');
  async function watchPrice(symbol, seconds) {
    const sel = doc.getElementById('symbol');
    sel.value = symbol;
    sel.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
    await sleep(6000);

    const priceNode = doc.getElementById('price');
    const stamps = [];
    let last = priceNode.textContent;
    const obs = new doc.defaultView.MutationObserver(() => {
      const now = priceNode.textContent;
      if (now !== last) { stamps.push(w.performance.now()); last = now; }
    });
    obs.observe(priceNode, { childList: true, characterData: true, subtree: true });
    await sleep(seconds * 1000);
    obs.disconnect();

    if (stamps.length < 2) {
      log(`  ${symbol.padEnd(12)} ${stamps.length} lan doi gia trong ${seconds}s`
          + '  (ngoai phien hoac khong co tick)');
      return;
    }
    const gaps = stamps.slice(1).map((t, i) => (t - stamps[i]) / 1000);
    gaps.sort((a, b) => a - b);
    const med = gaps[Math.floor(gaps.length / 2)];
    log(`  ${symbol.padEnd(12)} ${stamps.length} lan doi gia / ${seconds}s`
        + `  khoang cach: min ${gaps[0].toFixed(2)}s`
        + ` trung vi ${med.toFixed(2)}s max ${gaps[gaps.length - 1].toFixed(2)}s`);
  }
  // Truoc khi do gia: luong live co song khong?
  log(`  Live.enabled      : ${w.Live?.enabled}`);
  log(`  price-block hidden: ${doc.getElementById('price-block')?.hidden}`);
  log(`  price text        : ${JSON.stringify(doc.getElementById('price')?.textContent)}`);

  // Nghe thang socket cua app de dem message that su den
  let frames = 0, kinds = {};
  const origWS = w.WebSocket;
  w.WebSocket = function (...args) {
    const ws = new origWS(...args);
    ws.addEventListener('message', (ev) => {
      frames++;
      try { const k = JSON.parse(ev.data).type || '?'; kinds[k] = (kinds[k] || 0) + 1; }
      catch { kinds.raw = (kinds.raw || 0) + 1; }
    });
    return ws;
  };
  w.WebSocket.prototype = origWS.prototype;

  await watchPrice('BTCUSDT', 25);
  log(`    socket frames: ${frames} ${JSON.stringify(kinds)}`);
  frames = 0; kinds = {};
  await watchPrice('VN:VN30F1M', 25);
  log(`    socket frames: ${frames} ${JSON.stringify(kinds)}`);

  }

  if (wants('topbar')) {
  log('');
  log('=== topbar layout ===');
  const boxes = {};
  for (const sel of ['#symbol', '#timeframes', '.ct-picker', '#chart-type',
                     '.topbar-controls', '.topbar-right']) {
    const n = doc.querySelector(sel);
    if (!n) { log(`  ${sel}: KHONG co`); continue; }
    const r = n.getBoundingClientRect();
    boxes[sel] = r;
    const cs = w.getComputedStyle(n);
    log(`  ${sel.padEnd(18)} ${r.width.toFixed(0).padStart(5)}x${r.height.toFixed(0)}`
        + ` @ ${r.left.toFixed(0)},${r.top.toFixed(0)}`
        + `  right=${r.right.toFixed(0)} overflow=${cs.overflowX}`);
  }
  const tf = boxes['#timeframes'], ct = boxes['.ct-picker'];
  const controls = boxes['.topbar-controls'];
  if (tf && ct) {
    log(`  tf phai=${tf.right.toFixed(0)}  ct trai=${ct.left.toFixed(0)}`
        + `  -> chong lan: ${tf.right > ct.left + 1}`);
  }
  if (ct && controls) {
    log(`  ct phai=${ct.right.toFixed(0)}  controls phai=${controls.right.toFixed(0)}`
        + `  -> nut tran ra ngoai: ${ct.right > controls.right + 1}`);
  }
  const btn0 = doc.getElementById('chart-type');
  if (btn0) {
    const cs = w.getComputedStyle(btn0);
    log(`  #chart-type border=${cs.borderTopWidth} ${cs.borderTopStyle} ${cs.borderTopColor}`);
    log(`  #chart-type background=${cs.backgroundColor}`);
  }

  }

  if (wants('multichart')) {
  log('');
  log('=== multichart (luoi bieu do day du) ===');
  try {
    const cm = () => w.eval('ChartManager');
    const cells = () => [...doc.querySelectorAll('#chart-grid .cell')];
    const cellOf = (node) => node?.closest('.cell')?.dataset.cell;
    const caption = (i) => doc.querySelector(`[data-caption="${i}"]`)?.textContent.trim();
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);
    const grid = doc.getElementById('chart-grid');

    doc.querySelector('[data-layout="4"]').click();
    await until('four cells', () => cells().length === 4);
    log(`  4 o, bieu do chinh o o ${cellOf(doc.getElementById('chart-main'))}, o dang lam viec ${doc.querySelector('.cell.active')?.dataset.cell}`);

    for (const [i, symbol] of [[1, 'VN:VNINDEX'], [2, 'VN:G-XAUUSD'], [3, 'VN:VIC']]) {
      const sel = doc.querySelector(`[data-pick="${i}"]`);
      await until('option ' + symbol, () => [...sel.options].some((o) => o.value === symbol));
      sel.value = symbol;
      sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    }
    await until('candles in the three other cells',
      () => [1, 2, 3].every((i) => candlePixels(doc.querySelector(`[data-body="${i}"]`)) > 0));
    const box = (i) => { const r = doc.querySelector(`[data-cell="${i}"]`).getBoundingClientRect(); return `${Math.round(r.width)}x${Math.round(r.height)}`; };
    log(`  kich thuoc o: ${[0, 1, 2, 3].map(box).join(' / ')}`);
    log(`  diem nen o 1-3: ${[1, 2, 3].map((i) => candlePixels(doc.querySelector(`[data-body="${i}"]`))).join(', ')}`);

    // Indicators on the working chart, then twice more to test the guard.
    const seen = watchToasts(doc);
    const rsi = await until('RSI', () => doc.querySelector('.cat-item[data-id="rsi"]'));
    rsi.click();
    await until('RSI on', () => doc.querySelectorAll('#active .active-item').length === 1);
    rsi.click();
    await sleep(300);
    rsi.click();
    await sleep(300);
    log(`  bam RSI 3 lan: dang bat ${doc.querySelectorAll('#active .active-item').length}, thong bao ${seen.length}: "${(seen[0] || '').slice(0, 60)}"`);
    await until('caption 0 names RSI', () => /RSI/.test(caption(0) || ''));
    log(`  chu thich o 0: ${caption(0)}`);

    // Click cell 2: the working chart and the tools move there.
    doc.querySelector('[data-body="2"]').dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, cancelable: true }));
    await until('working chart in cell 2', () => cellOf(doc.getElementById('chart-main')) === '2');
    await until('G-XAUUSD loaded', () => (cm().seriesKey || '').startsWith('VN:G-XAUUSD|'));
    await sleep(1500);
    log(`  bam o 2 -> bieu do chinh o o ${cellOf(doc.getElementById('chart-main'))}, series ${cm().seriesKey}, chi bao dang bat ${doc.querySelectorAll('#active .active-item').length}`);
    await until('cell 0 redrawn with RSI', () => candlePixels(doc.querySelector('[data-body="0"]')) > 0);
    log(`  o 0 (vua roi): ${candlePixels(doc.querySelector('[data-body="0"]'))} diem nen, chu thich "${caption(0)}"`);

    // A strategy test runs on the active cell.
    doc.querySelector('.rail-btn[data-panel="strategy"]').click();
    await until('strategies', () => doc.getElementById('strategy-select').options.length > 0);
    doc.getElementById('run-backtest').click();
    await until('backtest metrics', () => doc.querySelectorAll('#metrics .metric').length > 0, 400);
    log(`  backtest tren o dang lam viec: ${doc.querySelectorAll('#metrics .metric').length} chi so, series ${cm().seriesKey}`);

    doc.querySelector('.cell-menu [data-tf="1d"]')?.click();
    await until('cell 1 caption 1d', () => /1d/.test(caption(1) || ''));
    log(`  banh rang o 1: khung ${frames.join(' ')}, chon 1d -> "${caption(1)}", o dang lam viec van ${cm().seriesKey}`);

    // Overview and back.
    const before = cells().map((c) => doc.querySelector(`[data-pick="${c.dataset.cell}"]`).value).join(', ');
    doc.getElementById('mode-toggle').click();
    await sleep(600);

    const mainWidth = Math.round(doc.getElementById('chart-main').getBoundingClientRect().width);
    log(`  Tong quan: ${doc.body.dataset.mode}, o hien ${shown}, bieu do rong ${mainWidth}px / grid ${Math.round(grid.getBoundingClientRect().width)}px`);
    doc.getElementById('mode-toggle').click();
    await sleep(800);
    const after = cells().map((c) => doc.querySelector(`[data-pick="${c.dataset.cell}"]`).value).join(', ');
    log(`  Giao dich lai: ${doc.body.dataset.mode}, ${cells().filter((c) => c.getBoundingClientRect().width > 0).length} o, giong luc truoc: ${before === after} (${after})`);

    doc.querySelector('[data-layout="1"]').click();
    await sleep(400);
    log(`  ve 1 khung: ${cells().length} o, bieu do chinh rong ${Math.round(doc.getElementById('chart-main').getBoundingClientRect().width)}px, series ${cm().seriesKey}`);
  } catch (e) {
    log('  LOI: ' + e.message);

  if (wants('switching')) {
  log('');
  log('=== switching ===');
  // Nam's report: switching symbol or timeframe back and forth leaves the
  // volume bars and an empty price area. Candle pixels on the main chart are
  // counted after every switch, quick and slow, because the failure shows up
  // only between the two requests of a fast switch if it is a race.
  const main = doc.getElementById('chart-main');
  const pick1 = async (symbol, tf, wait) => {
    const sel = doc.getElementById('symbol');
    if (symbol && sel.value !== symbol) {
      sel.value = symbol;
      sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    }
    if (tf) {

      const b = [...doc.querySelectorAll('#timeframes .tf-btn')].find((x) => x.textContent.trim() === tf);
      b?.click();
    }
    await sleep(wait);
  };
  const report = (label) => log(`  ${label.padEnd(34)} ${String(candlePixels(main)).padStart(6)} diem nen`);
  try {
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);
    doc.querySelector('[data-layout="1"]')?.click();
    await pick1('BTCUSDT', '1h', 3000); report('BTCUSDT 1h (cham)');
    await pick1(null, '15m', 3000);     report('BTCUSDT 15m (cham)');
    await pick1(null, '1h', 3000);      report('BTCUSDT 1h (cham)');
    await pick1('VN:VIC', null, 5000);  report('VN:VIC (cham)');
    await pick1('BTCUSDT', null, 3000); report('BTCUSDT (cham)');
    // Fast: the next change starts before the previous load finished.
    await pick1(null, '4h', 150); await pick1(null, '1h', 150); await pick1(null, '15m', 3500);
    report('4h->1h->15m nhanh');
    await pick1('VN:VIC', null, 200); await pick1('BTCUSDT', null, 3500);
    report('VIC->BTC nhanh');
    await pick1(null, '1d', 200); await pick1(null, '1h', 3500);
    report('1d->1h nhanh');
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('autoscale')) {
  log('');
  log('=== autoscale ===');
  /* Hypothesis for "candles vanish when switching": a vertical drag turns the
     price scale's autoScale off, the frozen range carries over to the next
     instrument, and its candles sit entirely outside the visible prices.
     Measured directly rather than by pixels: `ChartManager` is a global
     lexical binding, which indirect eval in the frame can read. */
  const cm = () => w.eval('ChartManager');
  const scaleState = () => {
    const c = cm();
    const series = c.priceSeries;
    const h = doc.getElementById('chart-main').clientHeight;
    const top = series.coordinateToPrice(10);
    const bottom = series.coordinateToPrice(h - 40);
    const data = series.data?.() || [];
    const last = data.length ? (data[data.length - 1].close ?? data[data.length - 1].value) : null;
    const auto = c.chart.priceScale('right').options().autoScale;
    const inside = last !== null && top !== null && bottom !== null && last <= top && last >= bottom;
    return `autoScale=${auto} range=${bottom?.toFixed(2)}..${top?.toFixed(2)} last=${last} ${inside ? 'NEN TRONG KHUNG' : 'NEN NGOAI KHUNG'}`;
  };
  const choose = async (symbol) => {
    const sel = doc.getElementById('symbol');
    sel.value = symbol;
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    await until('candles for ' + symbol, () => cm().seriesKey && cm().seriesKey.startsWith(symbol + '|'));
    await sleep(1500);
  };
  try {
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);
    await choose('BTCUSDT');
    log('  BTC, chua keo:      ' + scaleState());

    // A vertical drag in the plot area, the way a pan that drifts up does.
    const plot = [...doc.querySelectorAll('#chart-main canvas')]
      .filter((c) => !c.classList.contains('draw-layer'))
      .sort((a, b) => b.width * b.height - a.width * a.height)[0];
    const r = plot.getBoundingClientRect();
    const x = r.left + r.width * 0.5, y = r.top + r.height * 0.5;
    const fire = (type, dy) => plot.dispatchEvent(new w.MouseEvent(type, {
      bubbles: true, cancelable: true, clientX: x, clientY: y + dy, button: 0, buttons: 1, view: w,
    }));
    fire('mousedown', 0);
    for (let i = 1; i <= 12; i++) { doc.dispatchEvent(new w.MouseEvent('mousemove', { bubbles: true, clientX: x, clientY: y + i * 15, buttons: 1, view: w })); fire('mousemove', i * 15); await sleep(16); }
    fire('mouseup', 180);
    doc.dispatchEvent(new w.MouseEvent('mouseup', { bubbles: true, clientX: x, clientY: y + 180, view: w }));
    await sleep(500);
    log('  BTC, sau khi keo:   ' + scaleState());

    await choose('VN:VIC');
    log('  doi sang VIC:       ' + scaleState());
    await choose('BTCUSDT');
    log('  doi lai BTC:        ' + scaleState());
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('markets')) {
  log('');
  log('=== markets (chay nhieu thi truong) ===');
  // Nam: "run across markets shows nothing". The endpoint answered 200 in 3s
  // with every market; the table was written into the Results panel while the
  // button lives in the Strategy panel. Checked here as the user sees it:
  // which panel is open after the run, and whether its table has rows.
  try {
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);
    doc.querySelector('.rail-btn[data-panel="strategy"]').click();
    await until('strategies', () => doc.getElementById('strategy-select').options.length > 0);
    const add = doc.getElementById('mm-add');
    for (const symbol of ['BTCUSDT', 'VN:VIC', 'VN:VNINDEX']) {
      await until('option ' + symbol, () => [...add.options].some((o) => o.value === symbol));
      add.value = symbol;
      add.dispatchEvent(new w.Event('change', { bubbles: true }));
    }
    log(`  da chon: ${doc.querySelectorAll('#mm-chosen .mm-chip').length} thi truong`);
    doc.getElementById('run-markets').click();
    await until('the markets table', () => doc.querySelectorAll('#markets-output tbody tr').length > 0, 240);
    const panel = doc.querySelector('.panel.active')?.dataset.panel;
    const tab = doc.querySelector('[data-respanel].active')?.dataset.respanel;
    const visible = doc.getElementById('markets-output').getBoundingClientRect().width > 0;
    log(`  panel dang mo: ${panel}, tab: ${tab}, bang hien tren man hinh: ${visible}`);
    log(`  so dong: ${doc.querySelectorAll('#markets-output tbody tr').length}`);
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('picker')) {
  log('');
  log('=== picker (tim ma) ===');
  try {
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);
    const button = await until('the picker button', () => doc.querySelector('#symbol + .sp-button'));
    log(`  nut: "${button.textContent.trim()}"  select an: ${getComputedStyle(doc.getElementById('symbol')).display}`);
    button.click();
    await sleep(200);
    const pop = doc.querySelector('.sp-pop');
    log(`  popup mo: ${!pop.hidden}  so muc khi chua go: ${doc.querySelectorAll('.sp-item').length}`);
    const input = doc.querySelector('.sp-search');
    for (const query of ['vic', 'vingroup', 'VN30F', 'vang', 'btc']) {
      input.value = query;
      input.dispatchEvent(new w.Event('input', { bubbles: true }));
      await sleep(80);
      const first = [...doc.querySelectorAll('.sp-item')].slice(0, 3)
        .map((n) => n.querySelector('.sp-code').textContent).join(', ');
      log(`  "${query}" -> ${doc.querySelectorAll('.sp-item').length} ket qua, dau: ${first || '(khong co)'}`);
    }
    input.value = 'vic';
    input.dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(80);
    input.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await until('the chart to load VIC', () => w.eval('ChartManager').seriesKey?.startsWith('VN:VIC|'));
    log(`  Enter -> select=${doc.getElementById('symbol').value}, bieu do=${w.eval('ChartManager').seriesKey}, popup dong: ${pop.hidden}`);
    log(`  nhan nut sau khi chon: "${button.textContent.trim()}"`);
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('boot')) {
  log('');
  log('=== boot (man hinh mo dau cho du lieu) ===');
  await until('boot marks', () => bootMarks.splashGone && bootMarks.vnList && bootMarks.chart, 400);
  const dataReady = Math.max(bootMarks.chart, bootMarks.vnList);
  log(`  bieu do co du lieu:   ${bootMarks.chart} ms`);
  log(`  danh sach ma VN ve:   ${bootMarks.vnList} ms`);
  log(`  man hinh mo dau roi:  ${bootMarks.splashGone} ms`);
  log(`  roi SAU khi du lieu da ve: ${bootMarks.splashGone >= dataReady} (chenh ${bootMarks.splashGone - dataReady} ms)`);
  }

  if (wants('persist')) {
  log('');
  log('=== persist (tai lai trang khong mat viec dang lam) ===');
  try {
    const cmOf = (fw) => fw.eval('ChartManager');
    await until('the symbol catalogue', () => doc.getElementById('symbol').options.length > 1000);

    const sel = doc.getElementById('symbol');
    sel.value = 'VN:VIC';
    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    await until('VIC', () => cmOf(w).seriesKey?.startsWith('VN:VIC|'));
    const tf = await until('15m button', () => [...doc.querySelectorAll('#timeframes .tf-btn')].find((b) => b.textContent.trim() === '15m'));
    tf.click();
    await until('VIC 15m', () => cmOf(w).seriesKey === 'VN:VIC|15m');

    doc.querySelector('.rail-btn[data-panel="strategy"]').click();
    const range = await until('a strategy parameter', () => doc.querySelector('#strategy-params input[type="range"]'));
    range.value = String(Number(range.min) + 3);
    range.dispatchEvent(new w.Event('input', { bubbles: true }));
    const tuned = { name: range.dataset.sparam, value: range.value };

    (await until('RSI', () => doc.querySelector('.cat-item[data-id="rsi"]'))).click();
    await until('RSI active', () => doc.querySelectorAll('#active .active-item').length === 1);

    doc.querySelector('[data-layout="2"]').click();
    const pick = await until('cell 1 picker', () => doc.querySelector('[data-pick="1"]'));
    await until('cell 1 options', () => [...pick.options].some((o) => o.value === 'VN:VNINDEX'));
    pick.value = 'VN:VNINDEX';
    pick.dispatchEvent(new w.Event('change', { bubbles: true }));
    doc.querySelector('[data-gear="1"]').click();
    await sleep(150);
    doc.querySelector('.cell-menu [data-tf="1d"]')?.click();
    await sleep(900);
    log(`  truoc khi tai lai: VIC 15m + RSI (o 0), ${tuned.name}=${tuned.value}, o 1 VNINDEX 1d`);

    w.location.reload();
    await until('the old document to go', () => frame.contentDocument !== doc);
    const d2 = await appDocument(frame);
    const w2 = frame.contentWindow;
    await until('restored chart', () => { try { return cmOf(w2).seriesKey; } catch (e) { return null; } }, 400);
    await sleep(6000);

    const key = cmOf(w2).seriesKey;
    const panel = d2.querySelector('.rail-btn.active')?.dataset.panel || '(dong)';
    const indicators = [...d2.querySelectorAll('#active .active-item')].map((n) => n.dataset.instance);
    const param = d2.querySelector(`#strategy-params [data-sparam="${tuned.name}"]`)?.value;
    const layout = d2.getElementById('chart-grid')?.dataset.layout;
    const cell1 = d2.querySelector('[data-caption="1"]')?.textContent.trim();
    log(`  sau khi tai lai:   ${key}, panel ${panel}, ${tuned.name}=${param}, chi bao [${indicators.join(', ')}], layout ${layout}, o 1 "${cell1}"`);
    const ok = key === 'VN:VIC|15m' && panel === 'strategy' && String(param) === tuned.value
      && indicators.length === 1 && indicators[0].startsWith('rsi#') && layout === '2'
      && /VNINDEX/.test(cell1 || '') && /1d/.test(cell1 || '');
    log(`  ${ok ? 'GIU NGUYEN TOAN BO' : 'CO THU BI MAT'}`);
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('resize')) {
  log('');
  log('=== resize (keo gian luoi 2 va 4) ===');
  const drag = async (handle, dx, dy) => {
    const r = handle.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const ev = (type, px, py) => new w.PointerEvent(type, { bubbles: true, cancelable: true, clientX: px, clientY: py, pointerId: 1, button: 0, buttons: 1 });
    handle.dispatchEvent(ev('pointerdown', x, y));
    for (let i = 1; i <= 10; i++) { doc.dispatchEvent(ev('pointermove', x + dx * i / 10, y + dy * i / 10)); await sleep(16); }
    doc.dispatchEvent(ev('pointerup', x + dx, y + dy));
    await sleep(300);
  };
  try {
    doc.querySelector('[data-layout="4"]').click();
    await until('four cells', () => doc.querySelectorAll('#chart-grid .cell').length === 4);
    await sleep(500);
    const sizes = () => [0, 1, 2, 3].map((i) => {
      const r = doc.querySelector(`[data-cell="${i}"]`).getBoundingClientRect();
      return `${Math.round(r.width)}x${Math.round(r.height)}`;
    }).join(' / ');
    log(`  truoc:            ${sizes()}`);
    await drag(doc.querySelector('.grid-handle-col'), 200, 0);
    log(`  keo cot +200:     ${sizes()}`);
    await drag(doc.querySelector('.grid-handle-row'), 0, -120);
    log(`  keo hang -120:    ${sizes()}`);
    const col = doc.querySelector('.grid-handle-col').getBoundingClientRect();
    const edge = doc.querySelector('[data-cell="0"]').getBoundingClientRect().right;
    log(`  tay keo cot o x=${Math.round(col.left + col.width / 2)}, mep o 0 x=${Math.round(edge)}`);
    doc.querySelector('.grid-handle-col').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true }));
    doc.querySelector('.grid-handle-row').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true }));
    await sleep(300);
    log(`  nhap dup:         ${sizes()}`);
    doc.querySelector('[data-layout="1"]').click();
    await sleep(200);
    log(`  ve 1 khung: tay keo con ${doc.querySelectorAll('.grid-handle').length}`);
  } catch (e) {
    log('  LOI: ' + e.message);
  }
  }

  if (wants('charttype')) {
  log('');
  log('=== chart type menu ===');
  const btn = doc.getElementById('chart-type');
  const menu = doc.getElementById('chart-type-menu');
  btn.click();
  await sleep(600);
  const rect = menu.getBoundingClientRect();
  log(`  menu mo        : ${!menu.hidden}, ${menu.querySelectorAll('[data-chart-type]').length} muc`);
  log(`  kich thuoc     : ${rect.width.toFixed(0)}x${rect.height.toFixed(0)}`);
  /* The real question is not whether the menu is open but whether a click
     reaches it. It lives inside `.topbar-controls`, which scrolls, so an
     absolutely positioned menu is clipped to the bar and every click lands on
     the chart canvas behind it. */
  const hit = doc.elementFromPoint(rect.left + rect.width / 2, rect.top + 12);
  log(`  duoi con tro   : ${hit ? hit.tagName + '.' + hit.className : 'null'}`);
  log(`  bam duoc       : ${!!hit?.closest?.('[data-chart-type]')}`);
  btn.click();

  }

  if (wants('timing')) {
  log('');
  log('=== timing ===');
  const nav = w.performance.getEntriesByType('navigation')[0];
  if (nav) {
    log(`  domContentLoaded ${nav.domContentLoadedEventEnd.toFixed(0)}ms`);
    log(`  loadEventEnd     ${nav.loadEventEnd.toFixed(0)}ms`);
  }
  const res = w.performance.getEntriesByType('resource')
    .map((r) => ({ name: r.name.replace(/^https?:\/\/[^/]+/, ''), dur: r.duration,
                   sent: r.transferSize, raw: r.decodedBodySize }))
    .sort((a, b) => b.dur - a.dur);
  log('  5 tai nguyen cham nhat:');
  for (const r of res.slice(0, 5)) {
    log(`    ${r.dur.toFixed(0).padStart(6)}ms ${(r.sent / 1024).toFixed(1).padStart(8)}KB`
      + ` ${r.name.slice(0, 48)}`);
  }
  const sent = res.reduce((s, r) => s + r.sent, 0);
  const raw = res.reduce((s, r) => s + r.raw, 0);
  log(`  tong ${res.length} request, gui ${(sent / 1024).toFixed(0)}KB, goc ${(raw / 1024).toFixed(0)}KB`);
  log(`  picker: ${doc.getElementById('symbol').options.length} option`);

  }

  log('');
  log('DONE');
})().catch((e) => log('PROBE ERROR: ' + e.message));
</script>
