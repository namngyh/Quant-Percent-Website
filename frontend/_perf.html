<!doctype html>
<meta charset="utf-8">
<title>load timing probe</title>
<!--
  Measures where a page load actually spends its time, in the browser rather
  than at the server. Server timings say every endpoint answers in under
  100ms; this asks what the user waits for.

  Run (server must be up):
    chrome --headless --disable-gpu --virtual-time-budget=60000 \
           --dump-dom http://127.0.0.1:8000/static/_perf.html
-->
<pre id="out">running…</pre>
<iframe id="app" src="/#trade" style="width:1400px;height:900px"></iframe>
<script>
const out = [];
const log = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const w = frame.contentWindow;
  const doc = frame.contentDocument;
  await sleep(20000);                       // let everything settle

  const nav = w.performance.getEntriesByType('navigation')[0];
  if (nav) {
    log('--- navigation ---');
    log(`  responseEnd        ${nav.responseEnd.toFixed(0)}ms`);
    log(`  domContentLoaded   ${nav.domContentLoadedEventEnd.toFixed(0)}ms`);
    log(`  loadEventEnd       ${nav.loadEventEnd.toFixed(0)}ms`);
  }

  const res = w.performance.getEntriesByType('resource')
    .map((r) => ({
      name: r.name.replace(/^https?:\/\/[^/]+/, ''),
      dur: r.duration,
      size: r.transferSize,
      decoded: r.decodedBodySize,
      start: r.startTime,
    }))
    .sort((a, b) => b.dur - a.dur);

  log('\n--- 14 tai nguyen ton thoi gian nhat ---');
  log('  ' + 'duration'.padStart(9) + 'start'.padStart(9)
      + 'sent'.padStart(10) + 'raw'.padStart(10) + '  name');
  for (const r of res.slice(0, 14)) {
    log(`  ${r.dur.toFixed(0).padStart(7)}ms${r.start.toFixed(0).padStart(7)}ms`
      + `${(r.size / 1024).toFixed(1).padStart(8)}KB${(r.decoded / 1024).toFixed(1).padStart(8)}KB`
      + `  ${r.name.slice(0, 46)}`);
  }

  const totalSent = res.reduce((s, r) => s + r.size, 0);
  const totalRaw = res.reduce((s, r) => s + r.decoded, 0);
  log(`\n  tong: ${res.length} request, gui ${(totalSent / 1024).toFixed(0)}KB`
    + `, goc ${(totalRaw / 1024).toFixed(0)}KB`
    + `  -> nen duoc: ${totalSent >= totalRaw ? 'KHONG' : 'co'}`);

  // How long the picker itself costs: 1,728 options is a lot of DOM.
  const sel = doc.getElementById('symbol');
  log(`\n--- picker ---`);
  log(`  options trong DOM: ${sel ? sel.options.length : 0}`);
  const t0 = w.performance.now();
  const clone = sel.cloneNode(true);
  doc.body.appendChild(clone);
  clone.remove();
  log(`  chi phi nhan ban ca select: ${(w.performance.now() - t0).toFixed(1)}ms`);

  log('\nDONE');
})().catch((e) => log('PROBE ERROR: ' + e.message));
</script>
