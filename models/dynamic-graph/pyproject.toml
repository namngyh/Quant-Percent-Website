[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicgraph"
version = "0.1.0"
description = "DynamicGraph - Dynamic Financial Network Model for VN30"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - placeholder, see LICENSE" }
authors = [{ name = "DynamicGraph Team" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
db = ["duckdb>=0.9", "pyarrow>=12.0", "sqlalchemy>=2.0"]
explain = ["shap>=0.44", "interpret>=0.5"]
gnn = ["torch>=2.0", "torch-geometric>=2.4"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
viz = ["plotly>=5.18"]
tune = ["optuna>=3.5"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
community = ["python-louvain>=0.16", "igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "mypy>=1.8", "ruff>=0.3"]
all = [
    "duckdb>=0.9", "pyarrow>=12.0", "sqlalchemy>=2.0",
    "shap>=0.44", "interpret>=0.5",
    "torch>=2.0", "torch-geometric>=2.4",
    "fastapi>=0.110", "uvicorn>=0.27",
    "plotly>=5.18", "optuna>=3.5",
    "xgboost>=2.0", "lightgbm>=4.0",
    "python-louvain>=0.16",
    "pytest>=7.4",
]

[project.scripts]
dynamicgraph = "dynamicgraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynamicgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
