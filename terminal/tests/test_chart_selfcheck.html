<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>chart self-check</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="app" src="/#trade" style="width:1200px;height:760px;border:1px solid #ccc"></iframe>
<script>
/* The chart's own answer to "are there candles on screen?" (Nam, 2026-09-16).
 *
 * "Đổi mã xong thì mất nến" has been reported more than once and three rounds
 * of measurement failed to reproduce it, so the app now records the state when
 * a load ends with nothing in view. A detector nobody has tested is worse than
 * none — it would report nothing during the bug and be believed — so this page
 * forces each of the three shapes and checks it is named correctly.
 *
 *   copy beside index.html, then with the app on :8000
 *   chrome --headless --dump-dom --virtual-time-budget=60000 \
 *          http://127.0.0.1:8000/static/test_chart_selfcheck.html
 */
(async () => {
  const out = [];
  const say = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let failed = 0;
  const check = (name, ok, detail = '') => {
    say(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  -> ${detail}` : ''}`);
    if (!ok) failed += 1;
  };

  /* Wait for the condition, never for the clock.

     An earlier version of this file slept 500ms after applying a price-scale
     option and read the state back: headless had not repainted yet, so the
     check measured the OLD scale, failed, and the next check inherited the
     change it was supposed to have seen. Same trap as the history probe
     (CLAUDE.md, 2026-09-18). */
  const until = async (fn, ms = 4000) => {
    for (let waited = 0; waited < ms; waited += 100) {
      if (fn()) return true;
      // Nudge a repaint: `priceToCoordinate` answers from the last frame, and
      // headless draws no frames while this loop runs, so polling alone waits
      // forever on a value that has already changed underneath.
      try { cm.refreshSize(); } catch { /* not ready */ }
      await wait(100);
    }
    return fn();
  };

  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const w = frame.contentWindow;
  let cm = null;
  for (let i = 0; i < 150; i++) {
    try {
      cm = w.eval('ChartManager');
      if (cm.priceSeries && cm.priceSeries.data().length > 50) break;
    } catch { /* not up yet */ }
    await wait(200);
  }

  // The bars as loaded, kept so the series can be fed again below: applying a
  // price-scale option changes nothing until data arrives, which is the whole
  // reason this state shows up when a symbol is switched and not before.
  const original = cm.priceSeries.data().map((b) => ({
    time: b.time - 7 * 3600, open: b.open, high: b.high, low: b.low, close: b.close,
  }));
  const reload = () => cm.setCandles(original, [], { timeVisible: true, key: cm.seriesKey });

  // 1. A chart doing its job says so.
  const healthy = cm.diagnose();
  check('a loaded chart reports bars and nothing wrong',
        healthy.bars > 50 && !healthy.empty && !healthy.offscreen && !healthy.offPriceScale,
        JSON.stringify(healthy));
  check('and it knows which series it is holding',
        typeof healthy.series === 'string' && healthy.series.includes('|'), healthy.series);

  /* 2. Candles cannot be scrolled out of view sideways, which is why the
     detector has no branch for it.

     Measured, and my first reading of this was wrong: asking for a range 500
     bars past the end appeared to do nothing at all, because headless had not
     repainted before I read it back. What the library actually does is clamp —
     it keeps the last bars on screen however far you ask it to go. */
  const bars = healthy.bars;
  const scale = cm.timeScale;
  scale.setVisibleLogicalRange({ from: bars + 500, to: bars + 600 });
  await until(() => scale.getVisibleLogicalRange().from > bars - 10);
  const after = scale.getVisibleLogicalRange();
  check('scrolling far past the end still leaves bars in view',
        after.from < bars && cm.diagnose().empty === false,
        `${JSON.stringify(after)} against ${bars} bars`);
  cm.focusRecent();
  await wait(200);

  /* 3. The price axis somewhere the candles are not — the shape the earlier
     hypothesis blamed, and the one a probe counting candle pixels cannot see.

     The provider is applied with autoscale ON: it is what autoscaling asks,
     so with autoscale off it is never consulted. The first version of this
     check turned autoscale off first, measured no change, and passed anyway
     on an `||` — a check that cannot fail is not a check. */
  cm.priceSeries.applyOptions({ autoscaleInfoProvider: () => ({
    priceRange: { minValue: 1, maxValue: 2 },
  }) });
  reload();
  const caught = await until(() => cm.diagnose().offPriceScale === true);
  const adrift = cm.diagnose();
  check('a price scale pointing away from the candles is caught',
        caught && adrift.bars > 0, JSON.stringify(adrift));
  // Feeding the series again is what clears it: dropping the provider alone
  // leaves the scale where it was until something asks it to fit.
  /* `undefined` does not remove an option in this library — applyOptions
     merges, so undefined means "leave it alone" and the override survived.
     Deferring to the original is how a provider is actually stood down. */
  cm.priceSeries.applyOptions({ autoscaleInfoProvider: (original) => original() });
  reload();
  const cleared = await until(() => cm.diagnose().offPriceScale === false);
  check('and reloading the series clears it', cleared, JSON.stringify(cm.diagnose()));

  // 4. No data at all — a load that failed rather than a view that moved.
  const key = cm.seriesKey;
  cm.setCandles([], [], { timeVisible: true, key });
  await wait(300);
  const blank = cm.diagnose();
  check('an empty series is called empty, not offscreen',
        blank.empty === true && blank.bars === 0, JSON.stringify(blank));

  // 5. The incident log is where the app says it is, and holds shapes like these.
  w.localStorage.setItem('qp.chart-incidents.v1', JSON.stringify([{ ...blank, at: Date.now() }]));
  const stored = JSON.parse(w.localStorage.getItem('qp.chart-incidents.v1'));
  check('an incident survives in the browser for Nam to send on',
        Array.isArray(stored) && stored[0].empty === true, JSON.stringify(stored[0]).slice(0, 90));
  w.localStorage.removeItem('qp.chart-incidents.v1');

  say('');
  say(failed ? `${failed} failed` : 'chart self-check holds');
})();
</script>
</body>
</html>
