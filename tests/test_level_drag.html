<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>level drag</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="app" src="/#trade" style="width:1200px;height:760px;border:1px solid #ccc"></iframe>
<script>
/* Working a paper position on the chart (charts.js, Nam 2026-09-15).
 *
 * The black entry line carries the open P&L. Pulling away from it creates a
 * stop or a target; dropping one back on it removes it; a press that does not
 * move sends nothing. This drives the running app's chart with a synthetic
 * position and replaces the drag callback, so nothing reaches the server.
 * (The `paperdrag` group in _probe.html does the same against a real session,
 * and changes that session's levels while it runs.)
 *
 *   copy beside index.html, then with the app on :8000
 *   chrome --headless --dump-dom --virtual-time-budget=60000 \
 *          http://127.0.0.1:8000/static/test_level_drag.html
 */
(async () => {
  const out = [];
  const say = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let failed = 0;
  const check = (name, ok, detail = '') => {
    say(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  -> ${detail}` : ''}`);
    if (!ok) failed += 1;
  };

  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const w = frame.contentWindow;
  const errors = [];
  w.addEventListener('error', (e) => errors.push(e.message));

  let cm = null;
  for (let i = 0; i < 150; i++) {
    try {
      cm = w.eval('ChartManager');
      if (cm.priceSeries && cm.priceSeries.data().length > 50 && w.eval('MultiChart').activeCell) break;
    } catch { /* not ready */ }
    await wait(200);
  }
  const host = w.eval('MultiChart').activeCell.chartMain;
  const calls = [];
  cm.onLevelDragged = (key, price) => calls.push([key, price]);

  const last = cm.priceSeries.data().at(-1);
  const entry = +(last.close * 0.998).toFixed(2);
  const quantity = 0.5;
  const position = (extra = {}) => cm.setPositionLines({
    side: 1, entry, quantity, unit: 'USDT', label: 'LONG 0.5', ...extra,
  });
  const rect = () => host.getBoundingClientRect();
  const yOf = (price) => rect().top + cm.priceSeries.priceToCoordinate(price);
  const fire = (type, y) => host.dispatchEvent(new w.PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 3, isPrimary: true, button: 0,
    buttons: type === 'pointerup' ? 0 : 1, clientX: rect().left + rect().width / 2, clientY: y,
  }));
  const decimals = (v) => (String(v).split('.')[1] || '').length;

  // 1. The open P&L on the entry line, at a price chosen here.
  position();
  const vol = cm.volumeSeries.data().at(-1)?.value ?? 0;
  const bar = cm.priceSeries.data().at(-1);
  cm.updateCandle({
    time: bar.time - 7 * 3600, open: bar.open, high: Math.max(bar.high, entry + 10),
    low: Math.min(bar.low, entry + 10), close: entry + 10, volume: vol,
  }, cm.seriesKey);
  const title = cm.levelLines.entry?.title || '';
  check('the entry line carries the open P&L at the latest price',
        title.startsWith('LONG 0.5') && title.includes('+5.00 USDT'), title);

  // 2. Pull up from a long's entry: a target above it, on the price step.
  position();
  calls.length = 0;
  let ey = yOf(entry);
  fire('pointerdown', ey);
  for (let dy = 10; dy <= 50; dy += 10) fire('pointermove', ey - dy);
  const preview = cm.levelLines.target?.title || '';
  fire('pointerup', ey - 50);
  check('pulling up from a long entry sets a target above it',
        calls.length === 1 && calls[0][0] === 'target' && calls[0][1] > entry, JSON.stringify(calls));
  check('the price sent is on the price step, not the pointer float',
        calls.length === 1 && decimals(calls[0][1]) <= 2, String(calls[0]?.[1]));
  check('while dragging, the target shows what it would book',
        /^TP \+[\d,]+\.\d\d USDT$/.test(preview), preview);

  // 3. Pull down: a stop below it.
  position();
  calls.length = 0;
  ey = yOf(entry);
  fire('pointerdown', ey);
  for (let dy = 10; dy <= 50; dy += 10) fire('pointermove', ey + dy);
  fire('pointerup', ey + 50);
  check('pulling down sets a stop below it',
        calls.length === 1 && calls[0][0] === 'stop' && calls[0][1] < entry, JSON.stringify(calls));

  // 4. Up, then back across the entry: it becomes a stop and the target goes.
  position();
  calls.length = 0;
  ey = yOf(entry);
  fire('pointerdown', ey);
  for (let dy = 10; dy <= 50; dy += 10) fire('pointermove', ey - dy);
  const midTarget = cm.levelLines.target?.price ?? null;
  for (let dy = 40; dy >= -50; dy -= 10) fire('pointermove', ey - dy);
  const targetAfterCross = cm.levelLines.target;
  fire('pointerup', ey + 50);
  check('crossing back over the entry sets a stop and takes the half-made target off',
        midTarget > entry && targetAfterCross === null && calls.length === 1 && calls[0][0] === 'stop',
        JSON.stringify({ midTarget, targetAfterCross, calls }));

  // 5. Drop an existing stop back on the entry: removed.
  const stop = +(entry * 0.997).toFixed(2);
  position({ stop });
  calls.length = 0;
  ey = yOf(entry);
  const sy = yOf(stop);
  fire('pointerdown', sy);
  for (let i = 1; i <= 8; i++) fire('pointermove', sy + (ey - sy) * i / 8);
  const dropTitle = cm.levelLines.stop?.title || '';
  fire('pointerup', ey);
  check('dropping a stop back on the entry removes it',
        calls.length === 1 && calls[0][0] === 'stop' && calls[0][1] === null && cm.levelLines.stop === null,
        JSON.stringify({ calls, dropTitle }));
  check('and says so while it is over the line', dropTitle === 'SL ✕', dropTitle);

  // 6. A press on the entry that does not move sends nothing.
  position();
  calls.length = 0;
  ey = yOf(entry);
  fire('pointerdown', ey);
  fire('pointerup', ey);
  check('a press on the entry that does not move sends nothing', calls.length === 0, JSON.stringify(calls));

  // 7. A session update arriving mid-drag does not drop the drag.
  position();
  calls.length = 0;
  ey = yOf(entry);
  fire('pointerdown', ey);
  for (let dy = 10; dy <= 50; dy += 10) fire('pointermove', ey - dy);
  position({ stop });
  const heldTarget = cm.levelLines.target?.price ?? null;
  fire('pointerup', ey - 50);
  check('a redraw that arrives mid-drag is held until release',
        heldTarget > entry && calls.length === 1 && calls[0][0] === 'target',
        JSON.stringify({ heldTarget, calls }));

  cm.clearPositionLines();
  check('no page errors', errors.length === 0, errors.join(' | '));
  say('');
  say(failed ? `${failed} failed` : 'level drag holds');
})();
</script>
</body>
</html>
