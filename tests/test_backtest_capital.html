<!-- Backtest capital in millions for VND markets (Nam, 2026-09-17).
     copy beside index.html, then with the app on :8000:
     chrome --headless --dump-dom --virtual-time-budget=120000 http://127.0.0.1:8000/static/test_backtest_capital.html -->
<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="out">running</pre>
<iframe id="app" src="/#trade" style="width:1300px;height:800px;border:0"></iframe>
<script>
(async () => {
  const out = []; let failed = 0;
  const say = (m) => { out.push(m); document.getElementById('out').textContent = out.join('\n'); };
  const check = (n, ok, d = '') => { say(`${ok ? 'PASS' : 'FAIL'}  ${n}${d ? '  -> ' + d : ''}`); if (!ok) failed++; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById('app');
  await new Promise((r) => f.addEventListener('load', r, { once: true }));
  const w = f.contentWindow; const d = w.document;
  let cm;
  for (let i = 0; i < 150; i++) { try { cm = w.eval('ChartManager'); if (cm.priceSeries && cm.priceSeries.data().length > 50) break; } catch {} await wait(200); }
  const cap = d.getElementById('exec-capital'), unit = d.getElementById('exec-capital-unit'), sym = d.getElementById('symbol');
  const S = w.eval('Strategy');
  const pick = async (value) => {
    for (let i = 0; i < 150 && ![...sym.options].some((o) => o.value === value); i++) await wait(200);
    sym.value = value; sym.dispatchEvent(new w.Event('change'));
    for (let i = 0; i < 100 && cm.seriesKey?.split('|')[0] !== value; i++) await wait(200);
    await wait(300);
  };
  await pick('BTCUSDT');
  check('on BTCUSDT the capital is 10 000 with no million unit',
        Number(cap.value) === 10000 && unit.textContent === '' && S.execution().initial_capital === 10000,
        `${cap.value} "${unit.textContent}" ${S.execution().initial_capital}`);
  await pick('VN:VN30F1M');
  check('on VN30F1M the capital reads 100 million VND',
        Number(cap.value) === 100 && /(triệu|million) VND/.test(unit.textContent), `${cap.value} "${unit.textContent}"`);
  check('and the backtest is sent 100 000 000 dong', S.execution().initial_capital === 100e6, S.execution().initial_capital);
  cap.value = '250';
  check('a typed amount is sent in millions', S.execution().initial_capital === 250e6, S.execution().initial_capital);
  await pick('BTCUSDT');
  check('back on BTCUSDT the capital returns to 10 000',
        Number(cap.value) === 10000 && unit.textContent === '' && S.execution().initial_capital === 10000,
        `${cap.value} "${unit.textContent}"`);
  say(''); say(failed ? `${failed} failed` : 'backtest capital holds');
})();
</script></body></html>
