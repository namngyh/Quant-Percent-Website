# Deployment path. For local development run the API with uvicorn instead
# (see README.md) — the DB project already publishes 5432/6379 to the
# host, so there is no networking to set up and you get hot reload.
#
# The database and Redis live in the database/ compose project; this file
# only adds the API and its worker and joins that project's network, so the
# data pipeline keeps a single owner.
#
# Compose names that network <project>_default, and the project name comes
# from the folder the DB compose file sits in. On the current workstation
# the folder is `D:\Database - QuantPercent`, giving
# `database-quantpercent_default`. Start that project first, then:
#   docker compose up -d --build
# Check yours with `docker network ls` and set QP_NETWORK in .env to match.

services:
  api:
    build: .
    container_name: qp-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - qp-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    container_name: qp-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    command: ["python", "-m", "app.workers.scheduler"]
    networks:
      - qp-net
    depends_on:
      - api

networks:
  qp-net:
    external: true
    name: ${QP_NETWORK:-database-quantpercent_default}
