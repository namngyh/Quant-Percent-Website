name: quantpercent-production

services:
  timescaledb:
    image: ${TIMESCALE_IMAGE:?Set an immutable TimescaleDB image tag}
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: market
    volumes:
      - database_data:/var/lib/postgresql/data
      - ../../database/db/init:/docker-entrypoint-initdb.d:ro
    # Postgres readiness, not process liveness. A `pgrep -f 'app.worker'` check
    # briefly stood here — it belongs to the worker service and can never pass
    # in this container, which left `timescaledb` permanently unhealthy and so
    # never started `api`, `worker`, `migrate` or `db-role-init`, all of which
    # wait on `condition: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d market"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  db-role-init:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: market
      PGUSER: quant
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      QP_WEB_PASSWORD: ${QP_WEB_PASSWORD:?Set QP_WEB_PASSWORD}
    volumes:
      - ../scripts/create_role.sql:/scripts/create_role.sql:ro
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        psql --set="api_password=$$QP_WEB_PASSWORD"
        --file=/scripts/create_role.sql
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [private]

  migrate:
    build:
      context: ..
    profiles: ["tools"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://quant:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@timescaledb:5432/market
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      timescaledb: { condition: service_healthy }
      db-role-init: { condition: service_completed_successfully }
    networks: [private]

  api:
    build:
      context: ..
    restart: unless-stopped
    environment: &api_environment
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://qp_web:${QP_WEB_PASSWORD:?Set QP_WEB_PASSWORD}@timescaledb:5432/market
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      PUBLIC_SITE_URL: https://${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # SMTP is the fallback transport for setups without a verified sending
      # domain. Without these the container has no mail credentials at all and
      # every notification is silently skipped while the API still answers
      # success — the failure mode is invisible, so they are passed even when
      # the deployment uses Resend instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Quant Percent <noreply@quantpercent.com>}
      MARKET_DELAY_MINUTES: ${MARKET_DELAY_MINUTES:-0}
      STALE_AFTER_MINUTES: ${STALE_AFTER_MINUTES:-90}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ../../frontend/config:/catalogue/config:ro
    networks: [private]

  worker:
    build:
      context: ..
    restart: unless-stopped
    environment: *api_environment
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_AUTH_MODE: api
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_CSRF_COOKIE_NAME: qp_csrf
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      DATA_MODE: api
      API_BASE_URL: http://api:8000
    depends_on: [api]
    networks: [private]

  # QP Terminal (terminal.quantpercent.com). Không có đăng nhập riêng —
  # Caddy hỏi API website (forward_auth) trước mỗi request, và service này
  # không mở cổng ra ngoài.
  #
  # Nến Binance, DuckDB và tài khoản paper nằm trong volume terminal_data, nên
  # build lại không mất gì. Lần đầu phải nạp nến — và phải DỪNG terminal
  # trước, vì DuckDB chỉ cho một tiến trình giữ file (chạy lúc đang mở thì báo
  # "Could not set lock on file"):
  #   docker compose ... stop terminal
  #   docker compose ... run --rm terminal python scripts/backfill.py
  #   docker compose ... start terminal
  #
  # TERMINAL_MARKET_DSN trỏ vào timescaledb trong cùng mạng private bằng tài
  # khoản chỉ-đọc qp_remote, nên không cần Tailscale. Để trống thì phần cổ
  # phiếu Việt Nam báo "chưa cấu hình", phần Bitcoin vẫn chạy.
  terminal:
    build:
      context: ../../terminal
    restart: unless-stopped
    environment:
      MARKET_DSN: ${TERMINAL_MARKET_DSN:-}
      TELEGRAM_BOT_TOKEN: ${TERMINAL_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TERMINAL_TELEGRAM_CHAT_ID:-}
    volumes:
      - terminal_data:/app/data_store
    # Optimize / Monte Carlo có thể ăn hết RAM; giới hạn để website không bị
    # kéo sập theo trên máy KVM 2.
    mem_limit: 2g
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api, terminal]
    networks: [private]

  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGDATABASE: market
      PGUSER: quant
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup.sh:/scripts/backup.sh:ro
    entrypoint: ["sh", "/scripts/backup.sh"]
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  database_data:
  redis_data:
  caddy_data:
  caddy_config:
  terminal_data:
